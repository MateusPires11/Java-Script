<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = prompt("Qual o seu nome? ")
        var sal = Number(prompt("qual o seu salario? "))

        document.writeln(`Ola ${nome},seu nome tem ${nome.length} letras <br>`)
        document.writeln(`seu nome em maiusculas eh ${nome.toUpperCase()} <br>`)
        document.writeln(`seu nome em minusculas eh ${nome.toLowerCase()}<br>`)
        
        document.writeln(`seu salario eh ${sal.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}`)

        
    </script>
</body>
</html>
